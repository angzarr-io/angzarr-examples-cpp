name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Unbypassable guard against `--no-verify` / `LEFTHOOK=0` locally. Mirrors
  # the parent-side check that lefthook runs on pre-commit. Pointer-only
  # bumps pass; dirty submodule working trees fail.
  submodules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Verify submodules are clean
        run: just check-submodules-clean

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [submodules]
    container:
      image: ghcr.io/angzarr-io/angzarr-cpp:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # fetched below, non-recursive

      - name: Configure git safe directory
        # Wildcard covers nested submodule paths; the workspace-only form
        # leaves submodule git ops vulnerable to dubious-ownership.
        run: git config --global --add safe.directory '*'

      # Recursive checkout drags in angzarr-project's vendored example
      # repos, whose pinned refs are not fetchable; only the direct
      # submodules and the client's own proto submodule are needed.
      - name: Fetch submodules
        run: |
          git submodule update --init
          git -C angzarr-client-cpp submodule update --init

      - name: Install build dependencies
        run: apt-get update && apt-get install -y libboost-regex-dev libboost-filesystem-dev libboost-system-dev libboost-program-options-dev libboost-thread-dev nlohmann-json3-dev libasio-dev libtclap-dev clang-tidy ruby ruby-dev && gem install bundler --no-document

      - name: Build
        run: just -f justfile.container build

      - name: Test (unit)
        run: just -f justfile.container test-unit

      - name: Lint
        run: just -f justfile.container lint

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
